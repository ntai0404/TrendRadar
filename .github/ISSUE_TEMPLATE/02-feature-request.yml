# yaml-language-server: $schema=https://json.schemastore.org/github-issue-forms.json

name: 💡 I have an idea
description: Suggest new features, push style improvements, or experience optimization
title: "[Suggestion] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ### 💝 Welcome to share your creativity
        Your great ideas make TrendRadar better!
        
        Currently we are mainly focusing on improvements in the following directions:
        - ✨ **AI analysis capabilities**: smarter interpretation, richer analysis dimensions
        - 🎨 **Push experience**: better-looking layout and more reasonable information display
        - 🛠️ **Ease of use optimization**: simpler configuration and more stable operation
        
        *Note: We currently do not accept applications for access to the new crawler platform, thank you for your understanding. *

  - type: textarea
    id: feature-description
    attributes:
      label: 💭 What do you think?
      placeholder: |
        Please briefly describe:
        - What features would you like to add?
        - What problem does it solve?
        - If you have reference pictures or tools, please upload screenshots.
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: 🎯 Usage scenario (optional)
      placeholder: For example: While I'm at..., it would be great if I could...
    validations:
      required: false
