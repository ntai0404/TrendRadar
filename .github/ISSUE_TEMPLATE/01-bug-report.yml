# yaml-language-server: $schema=https://json.schemastore.org/github-issue-forms.json

name: 🐛 encountered a problem
description: The program runs abnormally, reports an error, or has function failure (including AI analysis problems)
title: "[Question] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### ⚠️ Must read before submitting
        **Please make sure you are using the latest version of TrendRadar. **
        Many issues may have been fixed in the latest code. If you are using an old version, I will not be able to handle it, please update first and try again.

        **Simple description + key screenshots** is the most effective way to communicate.

        ---
        ### 📌 How to check the version number?

        | Deployment method | View method |
        |---------|---------|
        | **Docker** | View the container startup log, the version number is displayed at the beginning of the log |
        | **GitHub Actions** | View the ![version](https://img.shields.io/badge/version-blue) badge at the top of the [README document](https://github.com/sansan0/TrendRadar) |
        | **Local Python** | View the `version` file in the project root directory |

  - type: input
    id: version
    attributes:
      label: 📦 TrendRadar version
      description: |
        Please be sure to provide a version number (eg: v5.2.0 or git commit id)
        💡 Docker users: View the container startup log | GitHub Actions users: View the version badge at the top of the document
      placeholder: v5.2.0 or commit hash
    validations:
      required: true

  - type: input
    id: mcp-version
    attributes:
      label: 🔌 MCP Server version (optional)
      description: If you are using MCP, please fill in the version of MCP Server.
      placeholder: v3.1.6 (leave blank for non-MCP users)
    validations:
      required: false

  - type: dropdown
    id: bug-category
    attributes:
      label: 🏷️ Question category
      options:
        - AI analysis related (error reporting, abnormal content, invalid prompt words, etc.)
        - Data acquisition related (news cannot be crawled, platform failure, etc.)
        - Notification push related (message not received, push error, etc.)
        - Deployment and operation related (Docker, Actions, Python error reporting)
        - other
    validations:
      required: true

  - type: input
    id: ai-model
    attributes:
      label: 🤖 AI model name (required for AI questions)
      description: |
        If the question is about AI analysis, please provide the specific model name you use.
        AI problems are closely related to model capabilities, and the performance of different models varies greatly.
      placeholder: "For example: deepseek/deepseek-chat, openai/gpt-4o, gemini/gemini-2.5-flash"
    validations:
      required: false

  - type: textarea
    id: bug-description
    attributes:
      label: 📝 describe what happened
      placeholder: |
        Please describe:
        1. What are you doing?
        2. What error occurred? (If it is an AI problem, please post an error message indicating that the analysis failed)
        3. It is recommended to upload a screenshot, which is more powerful than text!
    validations:
      required: true

  - type: textarea
    id: error-logs
    attributes:
      label: 📋 Error log/configuration (optional)
      description: |
        Post relevant error logs or config.yaml fragments (remember to hide sensitive information such as API Key)
        💡 Docker users: Use `docker logs trendradar` to view logs
      placeholder: |
        Post relevant error logs or config.yaml snippets:
        ```
        Post content here...
        ```
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: 📷 Screenshot (strongly recommended)
      description: |
        ⚠️ **IMPORTANT NOTE**: Please provide **full screenshot**, don’t just take a partial screenshot!
        - Error screenshots should contain the complete error message and context
        - Push screenshots should contain the complete message content
        - Configuration screenshots should contain the complete content of the relevant configuration section

        Partial screenshots often lack key information, making it difficult to locate the problem.
      placeholder: Drag the screenshot here. Please make sure the screenshot is complete and contains enough contextual information.
    validations:
      required: false

  - type: dropdown
    id: environment
    attributes:
      label: 🖥️ usage environment
      options:
        - Docker (local/NAS)
        - GitHub Actions
        - Local Python run
        - MCP Server client (Cherry Studio, etc.)
    validations:
      required: true