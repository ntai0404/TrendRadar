# yaml-language-server: $schema=https://json.schemastore.org/github-issue-forms.json

name: ✨ AI prompt word sharing and configuration help
description: Share your tuned ai_analysis_prompt.txt or ask for help setting it up
title: "[AI/Configuration] "
labels: ["config", "AI"]
body:
  - type: markdown
    attributes:
      value: |
        ### ✨ Prompt word sharing plan
        Feel free to share your carefully tuned `ai_analysis_prompt.txt` content here!
        Excellent prompt words can make AI analysis more accurate and interesting.

        ---
        If you are **seeking configuration help**, please try to post your error performance.

        ---
        ### 📌 How to check the version number?

        | Deployment method | View method |
        |---------|---------|
        | **Docker** | View the container startup log, the version number is displayed at the beginning of the log |
        | **GitHub Actions** | View the ![version](https://img.shields.io/badge/version-blue) badge at the top of the [README document](https://github.com/sansan0/TrendRadar) |
        | **Local Python** | View the `version` file in the project root directory |

  - type: dropdown
    id: category
    attributes:
      label: 🏷️ purpose
      options:
        - Share my AI prompts (ai_analysis_prompt.txt)
        - Get help setting up AI analytics
        - Seek help with basic function configuration (Webhook/RSS, etc.)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 📦 TrendRadar version (required when asking for help)
      description: |
        If you are asking for help, please provide the version number.
        💡 Docker users: View the container startup log | GitHub Actions users: View the version badge at the top of the document
      placeholder: v5.2.0 or commit hash (the sharing prompt word can be left blank)
    validations:
      required: false

  - type: input
    id: ai-model
    attributes:
      label: 🤖 AI model name
      description: |
        Please provide the specific model name you are using.
        AI analysis results are closely related to model capabilities, and the performance of different models varies greatly.
        Please indicate this when sharing the prompt words so that other users can refer to them.
      placeholder: "For example: deepseek/deepseek-chat, openai/gpt-4o, gemini/gemini-2.5-flash"
    validations:
      required: false

  - type: textarea
    id: share-content
    attributes:
      label: 📄 Content description
      placeholder: |
        - If sharing: please post your prompt word code block and briefly describe its analysis style.
        - If you are asking for help: please post your configuration fragment (hidden key) and the phenomenon you encountered.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 📷 Effect screenshot (recommended)
      description: |
        ⚠️ **IMPORTANT NOTE**: Please provide **full screenshot**, don’t just take a partial screenshot!
        - When sharing: Show the complete output of AI analysis
        - When asking for help: display the complete error message or abnormal behavior

        Partial screenshots often lack key information, making it difficult to locate the problem.
      placeholder: Drag the analysis result screenshot or configuration screenshot here. Please make sure the screenshot is complete.
    validations:
      required: false
