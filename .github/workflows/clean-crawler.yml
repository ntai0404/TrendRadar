name: Check In

# ✅ Sign-in renewal: Run this workflow to reset the 7-day timer and keep "Get Hot News" running normally
# ✅ Renewal: Run this workflow to reset the 7-day timer and keep "Get Hot News" active
#
# 📌 How to use:
# 1. Click "Run workflow" button / Click "Run workflow" button
# 2. Run at least once every 7 days / Run at least once every 7 days

on:
  workflow_dispatch:

jobs:
  del_runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete all workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0
          delete_workflow_by_state_pattern: "ALL"
          delete_run_by_conclusion_pattern: "ALL"