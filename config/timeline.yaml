# ═══════════════════════════════════════════════════════════════
#                   TrendRadar Timeline Configuration
#                      Version: 1.2.0
# ═══════════════════════════════════════════════════════════════
#
# This file controls "what to do and when".
#
# Most people do not need to edit this file.
# Just select a preset template in config.yaml:
#
#   schedule:
#     preset: "morning_evening"    ← Just change it here
#
#
# Visual configuration editor URL: https://sansan0.github.io/TrendRadar/
#
#
# ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─
# 📖 Basic Concepts (to help you understand the following configuration)
# ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─
#
#
# 🔁 How does the program run?
#
#   TrendRadar does not run continuously in the background, but is periodically awakened by a "timer alarm":
#
#     GitHub Actions users → Triggered by the cron schedule in .github/workflows/crawler.yml
#                           Runs once an hour by default (e.g., at the 33rd minute of every hour)
#
#     Docker users         → Triggered by the CRON_SCHEDULE in docker/.env
#                           Runs every 30 minutes by default
#
#   Each time it is awakened, the program executes the following three stages in order:
#
#     1️⃣ Collection (collect)
#        Crawl the latest data from various trending platforms + RSS feeds, and save it to the database
#
#                  ⬇
#
#     2️⃣ Analysis (analyze)
#        Call the AI large model to conduct in-depth analysis of the collected news (optional, requires API Key configuration)
#
#                  ⬇
#
#     3️⃣ Push (push)
#        Send the organized trending news + AI analysis results to your notification channels
#        (Feishu, DingTalk, Telegram, Email, etc.)
#
#   These three stages can be toggled independently. The purpose of this file is to control:
#   "In which time periods, which stages are enabled/disabled".
#
#
# 🔌 The relationship between the master switches in config.yaml and the timeline period switches
#
#   There are several "master switches" in config.yaml, and their priority is higher than this file:
#
#     platforms.enabled: false   → Never crawl trending lists (no matter how timeline is set)
#     rss.enabled: false         → Never crawl RSS (same as above)
#     notification.enabled: false → Never push notifications (same as above)
#     ai_analysis.enabled: false  → Never analyze (same as above)
#
#   The timeline period switches will only take effect when the master switch is true.
#   In other words: the master switch determines "whether it can be done", and the timeline determines "when to do it".
#
#
# ⏰ What are "time periods" and "silent periods"?
#
#   You can imagine a day as a timeline, divided into several "time periods".
#   Each time period has its own behavior switches (whether to collect, whether to analyze, whether to push).
#
#   The time that is not in any time period is called the "silent period" (uses the default configuration).
#   Collection is usually required during the silent period, so that data continues to accumulate,
#   and when it's time to push, a complete report can be summarized.
#
#
#   💡 The longer the silent period, the richer the accumulated data (ranking change trajectory, time on/off the list, etc.),
#   and the more complete the context finally submitted for AI analysis, resulting in higher analysis quality.
#   Compared to MCP Server, the full-day data of this solution can present a more complete trend of popularity and evolution of changes.
#
#
# ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─
# 📋 List of preset templates (just choose one)
# ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─
#
#   1️⃣ always_on        24/7, push on new updates (default)
#   2️⃣ morning_evening  All-day push + evening summary (recommended for most)
#   3️⃣ office_hours     Workday 3-phase: morning brief → noon hot topics → off-work summary
#   4️⃣ night_owl        Afternoon brief + late-night daily summary
#   5️⃣ custom           Fully customizable (requires editing the custom section at the bottom of this file)
#
# Want to customize? Two ways:
#   1. Scroll directly to the "Custom Mode" section at the bottom of this file
#   2. Add your own preset template in the presets below
#      (As long as the key is unique, then just fill in your template name in config.yaml)
#
# ⚠️ Suggestions for time period design:
#   GitHub Actions: Recommended cron interval ≥ 2 hours. Due to random delays in system triggers, too short an interval may cause missed runs.
#   Docker users: cron timing is punctual, no such limitation, set as needed.
#
#
# ═══════════════════════════════════════════════════════════════


# ───────────────────────────────────────────────────────────────
# Preset templates
# ───────────────────────────────────────────────────────────────
presets:

  # ───────────────────────────────────────────────────────────
  # 1️⃣ always_on - 24/7 monitoring
  #
  # The simplest mode: 24/7 collection + push, notifies you of any new updates.
  # No time periods divided, uses the same configuration all day.
  # Suitable for: Heavy users, real-time public opinion monitoring
  #
  # All day: Push ✓ | AI analysis ✗ | Unlimited push times
  # ───────────────────────────────────────────────────────────
  always_on:
    name: "All-day monitoring"
    description: "24/7 monitoring, pushes immediately on new updates. Suitable for heavy users."

    # Default configuration ── Use these switches when not in any time period
    # Because this mode has no time periods, default is the all-day behavior
    default:
      collect: true                # Collect data (crawl hot lists + RSS)
      analyze: false               # No AI analysis (save API costs)
      ai_mode: "current"           # AI analyzes current list
      push: true                   # Push on new content
      report_mode: "incremental"   # Only push new content to avoid duplication
      once:                        # Limit to execute only once per time period
        analyze: false             #   No limit on analysis times
        push: false                #   No limit on push times

    # No time periods defined, uses default all day
    #
    # Syntax tip: {} is YAML's "empty dictionary" notation, meaning it contains nothing.
    # Equivalent to writing multiple lines but filling nothing. The [] below is similar, meaning "empty list".
    periods: {}
    day_plans:
      all_day:
        periods: []                   # Empty list = no time periods enabled for this day
    week_map:
      1: "all_day"                 # Monday
      2: "all_day"                 # Tuesday
      3: "all_day"                 # Wednesday
      4: "all_day"                 # Thursday
      5: "all_day"                 # Friday
      6: "all_day"                 # Saturday
      7: "all_day"                 # Sunday


  # ───────────────────────────────────────────────────────────
  # 2️⃣ morning_evening - Morning and evening summary (Recommended)
  #
  # Push current hot topics all day + make a full-day summary in the evening.
  # Suitable for: Most people
  #
  # Default (All day): Push ✓ | AI analysis ✓ | Unlimited push times
  # Evening summary: Push ✓ | AI analysis ✓ | Push/analyze only once
  # ───────────────────────────────────────────────────────────
  morning_evening:
    name: "Morning and evening summary"
    description: "All-day push + evening daily summary. Suitable for most people."

    # Default configuration ── Behavior when no time period is matched
    default:
      collect: true                # Always collect
      analyze: true                # AI analyzes current list
      ai_mode: "current"           # AI analyzes current list
      push: true                   # Push current hot topics on the list every time
      report_mode: "current"       # Current news on the list
      # frequency_file: "xxx.txt"               # Keyword file (optional, located in config/custom/keyword/)
      # interests_file: "xxx.txt"                # AI interests file (optional, located in config/custom/ai/)
      # filter_method: "keyword"                # Filter strategy (optional: keyword | ai, if empty uses global filter.method)
      once:
        analyze: false             # Unlimited analysis times
        push: false                # Unlimited push times

    # Time period definition ── Only evening summary needs special handling
    periods:
      evening_summary:
        name: "Evening summary"
        start: "20:00"
        end: "22:00"
        # frequency_file: "xxx.txt"               # Keyword file (optional, located in config/custom/keyword/)
        # interests_file: "xxx.txt"                # AI interests file (optional, located in config/custom/ai/)
        # filter_method: "keyword"                # Filter strategy (optional: keyword | ai, if empty uses global filter.method)
        analyze: true              # Do AI analysis in the evening
        ai_mode: "daily"           # AI also summarizes full-day content
        report_mode: "daily"       # Switch to all news summary of the day
        once:
          analyze: true            # Analyze only once within the window
          push: true               # Push only once within the window

    # Daily plan ── Assemble time periods into a day's schedule
    day_plans:
      all_day:
        periods: ["evening_summary"]

    # Weekly mapping ── Which daily plan to use each day (1=Monday ... 7=Sunday)
    week_map:
      1: "all_day"
      2: "all_day"
      3: "all_day"
      4: "all_day"
      5: "all_day"
      6: "all_day"
      7: "all_day"


  # ───────────────────────────────────────────────────────────
  # 3️⃣ office_hours - Office hours push
  #
  # Three-stage push on weekdays, incremental free push on weekends.
  # Suitable for: Office workers, enterprise users
  #
  # Default (Silent period): Push ✗ | AI analysis ✗
  # Arrival quick glance: Push ✓ | AI analysis ✓ | Push only once
  # Noon hot topics: Push ✓ | AI analysis ✗ | Push only once
  # Off-work summary: Push ✓ | AI analysis ✓ | Push only once
  # Weekend free: Push ✓ | AI analysis ✗ | Unlimited push times
  # ───────────────────────────────────────────────────────────
  office_hours:
    name: "Office Hours"
    description: "Three-stage push on workdays (arrival→noon→off work), incremental free push on weekends."

    default:
      collect: true
      analyze: false
      ai_mode: "current"
      push: false                  # Default no push
      report_mode: "current"
      once:
        analyze: true              # Analyze only once per period
        push: true                 # Push only once per period

    periods:
      morning_briefing:
        name: "Arrival Overview"
        start: "09:00"
        end: "11:00"
        analyze: true              # AI analyzes current hot topics
        ai_mode: "current"         # AI analyzes current rankings
        push: true                 # View current hot topics after arrival
        report_mode: "current"     # News currently on the list
        # once inherits default (analyze: true, push: true) → Push/analyze only once

      noon_update:
        name: "Noon Hot Topics"
        start: "13:00"
        end: "15:00"
        push: true                 # Push current hot topics at noon
        report_mode: "current"     # News currently on the list
        # analyze inherits default: false → No AI analysis at noon to save API
        # once inherits default (push: true) → Push only once

      closing_summary:
        name: "End of Day Summary"
        start: "17:00"
        end: "19:00"
        analyze: true              # AI does full-day summary analysis
        ai_mode: "daily"           # AI also analyzes full-day content
        push: true                 # Push complete daily summary before getting off work
        report_mode: "daily"       # Summary of all news of the day
        # once inherits default (analyze: true, push: true) → Push/analyze only once

      weekend_free:
        name: "Weekend Free"
        start: "08:00"
        end: "23:00"
        ai_mode: "current"         # AI analyzes current rankings
        push: true                 # Push if there are new additions
        report_mode: "incremental" # Incremental mode: push only if there are new additions, otherwise stay quiet
        once:
          analyze: false           # No limit on analysis frequency
          push: false              # No limit on push frequency

    # Use three-stage push on workdays; use incremental free mode on weekends
    day_plans:
      workday:
        periods: ["morning_briefing", "noon_update", "closing_summary"]
      weekend:
        periods: ["weekend_free"]  # Weekends: push if there are new additions, do not disturb sleep

    week_map:
      1: "workday"                 # Monday → Workday plan
      2: "workday"
      3: "workday"
      4: "workday"
      5: "workday"
      6: "weekend"                 # Saturday → Weekend plan
      7: "weekend"                 # Sunday → Weekend plan


  # ───────────────────────────────────────────────────────────
  # 4️⃣ night_owl - Night owl mode
  #
  # Quiet during the day, push once in the afternoon and once late at night.
  # Suitable for: night workers, overseas users with time difference, freelancers
  #
  # Default (daytime silence): Push ✗ | AI analysis ✗
  # Afternoon overview: Push ✓ | AI analysis ✓ | Push only once
  # Late night summary: Push ✓ | AI analysis ✓ | Push only once
  # ───────────────────────────────────────────────────────────
  night_owl:
    name: "Night Owl Mode"
    description: "Afternoon quick glance + late-night full-day summary. Suitable for night workers and overseas users with time differences."

    default:
      collect: true
      analyze: false
      ai_mode: "current"
      push: false
      report_mode: "current"
      once:
        analyze: true              # Analyze only once per period
        push: true                 # Push only once per period

    periods:
      afternoon_peek:
        name: "Afternoon Quick Glance"
        start: "15:00"
        end: "17:00"
        analyze: true              # AI analyzes current hot topics
        ai_mode: "current"         # AI analyzes current rankings
        push: true                 # View current hot topics in the afternoon
        report_mode: "current"     # News currently on the list
        # once inherits default (analyze: true, push: true) → push/analyze only once

      late_night:
        name: "Late-Night Summary"
        start: "22:00"
        end: "01:00"               # start > end → automatically recognized as cross-day
        analyze: true              # AI performs full-day summary analysis
        ai_mode: "daily"           # AI also analyzes full-day content
        push: true                 # Push complete daily summary late at night
        report_mode: "daily"       # Summary of all news for the day
        # once inherits default (analyze: true, push: true) → push/analyze only once

    day_plans:
      all_day:
        periods: ["afternoon_peek", "late_night"]
    week_map:
      1: "all_day"
      2: "all_day"
      3: "all_day"
      4: "all_day"
      5: "all_day"
      6: "all_day"
      7: "all_day"


# ═══════════════════════════════════════════════════════════════
#
# 5️⃣ Custom Mode
#
# When schedule.preset: "custom" is set in config.yaml,
# the system will read the configuration below.
#
# If the preset templates above cannot meet your needs, you can freely define them here.
#
# ═══════════════════════════════════════════════════════════════
#
# The idea of custom configuration is very simple, like building blocks:
#
#   Step 1: Define "building blocks" (periods)
#            Each block = a time period + what to do during this period
#            Example: Morning 08-10 push, Evening 19-21 summary
#
#   Step 2: Assemble into "a day's plan" (day_plans)
#            Combine the building blocks to form a daily schedule
#            Example: Workdays use [Morning, Evening], Weekends use [Evening]
#
#   Step 3: Specify "which plan to use each day" (week_map)
#            Which daily plan corresponds to Monday through Sunday
#            Example: Monday~Friday use workday, Saturday and Sunday use weekend
#
#   There is also a "default configuration" (default),
#   when a certain time is not within any building block, the default configuration is used.
#   Fields not written in the building blocks will also automatically fall back to the default configuration.
#
#
# Below is a complete custom example, using different time period arrangements for workdays and weekends:
#
#   Workday time periods:
#     Late-night silent 23:00-06:00 (cross-day): Collect ✓ | Analyze ✓ | Push ✗
#     Workday morning 08:00-10:00: Push ✓ | incremental
#     Evening summary 19:00-21:00: Push ✓ | Analyze ✓ | daily
#     The rest of the time uses the default configuration (silent collection)
#
#   Weekend time periods:
#     Late-night silence 23:00-06:00 (cross-day): Collect ✓ | Analyze ✓ | Push ✗
#     Weekend morning 10:00-12:00: Push ✓ | daily
#     Evening summary 19:00-21:00: Push ✓ | Analyze ✓ | daily
#     Other times use default configuration (silent collection)

custom:
  name: "Custom"
  description: "Completely free definition of time periods, daily plans, and weekly mappings."

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Default configuration
  #
  # Use these switches when the current time is not within any time period (building block).
  # Fields not specified in the time period will also fall back here.
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  default:
    collect: true                  # Whether to collect data (crawl hotlists + RSS)
    analyze: false                 # Whether to execute AI analysis
    ai_mode: "current"            # AI analysis mode:
                                   #   follow_report → Follow report_mode
                                   #   daily         → Force full-day summary
                                   #   current       → Force current list
                                   #   incremental   → Force incremental mode
    push: false                    # Whether to send push notifications
    report_mode: "current"         # Report mode:
                                   #   daily       → Summary of all news for the day
                                   #   current     → News currently on the list
                                   #   incremental → Only push new content

                                   
    # frequency_file: "general.txt"
                                   # Keyword file (optional, located in config/custom/keyword/)
                                   # If left blank, the default config/frequency_words.txt is used
                                   # This field can also be set in the time period (period) to override the default value
                                   # For example, use the tech vocabulary for the evening summary:
                                   #   frequency_file: "tech.txt"
                                   # Note: Only effective when filter_method is keyword
                                   
    # interests_file: "finance.txt"
                                   # AI interest description file (optional, located in config/custom/ai/)
                                   # If left blank, the default config/ai_interests.txt is used
                                   # This field can also be set in the time period (period) to override the default value
                                   # For example, use financial interests for the evening summary:
                                   #   interests_file: "finance.txt"
                                   # Note: Only effective when filter_method is ai

    # filter_method: "keyword"     # Filtering strategy (optional: keyword | ai)
                                   # If left blank, the global config.yaml's filter.method is used
                                   # This field can also be set in the time period (period) to override
                                   # For example, use AI filtering for the evening summary:
                                   #   filter_method: "ai"
    once:
      analyze: true                # Only analyze once within this time period (save API)
      push: true                   # Only push once within this time period (reduce disturbance)


  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Step 1: Define building blocks (time periods)
  #
  # Each time period has a unique key (e.g., deep_quiet),
  # and start / end indicating the effective time range.
  #
  # Only write "fields different from default", the rest will automatically inherit from default.
  # For example, if weekday_morning doesn't specify collect, it will inherit collect: true from default.
  #
  # Tip: If start > end (e.g., 22:00 → 07:00),
  #       the system will automatically recognize it as a time period crossing midnight.
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  periods:

    deep_quiet:
      name: "Late Night Silence"
      start: "23:00"
      end: "06:00"                 # 23:00 → next day 06:00 (cross-day time period)
      # frequency_file: "xxx.txt"               # Keyword file (optional, located in config/custom/keyword/)
      # interests_file: "xxx.txt"                # AI interests file (optional, located in config/custom/ai/)
      # filter_method: "keyword"                # Filtering strategy (optional: keyword | ai, if empty uses global filter.method)
      collect: true                # Continue collecting data at night
      analyze: true                # Can run AI analysis at night (won't push anyway)
      push: false                  # Do not push late at night to avoid disturbance

    weekday_morning:
      name: "Weekday Morning"
      start: "08:00"
      end: "10:00"                 # 2h span, leaving enough margin for triggering
      # frequency_file: "xxx.txt"               # Keyword file (optional, located in config/custom/keyword/)
      # interests_file: "xxx.txt"                # AI interests file (optional, located in config/custom/ai/)
      # filter_method: "keyword"                # Filtering strategy (optional: keyword | ai, if empty uses global filter.method)
      push: true                   # Push once in the morning
      report_mode: "incremental"   # Only push new content
      # once inherits default (push: true) → only push once within the window

    weekend_morning:
      name: "Weekend Morning"
      start: "10:00"
      end: "12:00"                 # 2h span
      # frequency_file: "xxx.txt"               # Keyword file (optional, located in config/custom/keyword/)
      # interests_file: "xxx.txt"                # AI interests file (optional, located in config/custom/ai/)
      # filter_method: "keyword"                # Filtering strategy (optional: keyword | ai, if empty uses global filter.method)
      push: true
      report_mode: "daily"         # View full day summary on weekends
      # once inherits default (push: true) → only push once within the window

    evening_summary:
      name: "Evening Summary"
      start: "19:00"
      end: "21:00"
      # frequency_file: "xxx.txt"               # Keyword file (optional, located in config/custom/keyword/)
      # interests_file: "xxx.txt"                # AI interests file (optional, located in config/custom/ai/)
      # filter_method: "keyword"                # Filtering strategy (optional: keyword | ai, if empty uses global filter.method)
      analyze: true                # Do AI analysis in the evening
      ai_mode: "daily"             # AI also analyzes full day content
      push: true                   # Push in the evening
      report_mode: "daily"         # Summary of all news of the day
      # once inherits default (analyze: true, push: true) → only analyze/push once


  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Step 2: Assemble the building blocks into a daily plan
  #
  # Combine the time periods defined above into a daily schedule.
  # You can define multiple daily plans (e.g., workday and weekend),
  # and then assign them to different days of the week in week_map in Step 3.
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  day_plans:
    workday:                       # Workday plan
      periods: ["deep_quiet", "weekday_morning", "evening_summary"]
    weekend:                       # Weekend plan (replace weekday_morning with weekend_morning)
      periods: ["deep_quiet", "weekend_morning", "evening_summary"]


  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Step 3: Specify which daily plan to use for each day
  #
  # 1=Monday  2=Tuesday  3=Wednesday  4=Thursday  5=Friday  6=Saturday  7=Sunday
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  week_map:
    1: "workday"                   # Monday → Workday plan
    2: "workday"                   # Tuesday
    3: "workday"                   # Wednesday
    4: "workday"                   # Thursday
    5: "workday"                   # Friday
    6: "weekend"                   # Saturday → Weekend plan
    7: "weekend"                   # Sunday


  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Conflict strategy (usually no need to change)
  #
  # What is a "conflict"?
  #   If two of your time periods overlap (e.g., A is 08:00-12:00, B is 10:00-14:00),
  #   then the period 10:00-12:00 belongs to both A and B, creating a conflict.
  #   At this point, the program needs to know: which one should it follow?
  #
  # Two ways to handle this:
  #
  #   error_on_overlap (recommended)
  #     Directly report an error, reminding you to modify the configuration.
  #     Suitable for most people — overlapping time periods are usually a mistake, and an error helps you spot it in time.
  #
  #   last_wins
  #     In the periods list of day_plans, the ones written later take priority.
  #     For example, with periods: ["A", "B"], B takes effect when they overlap.
  #     Suitable scenario: You want to use a large time period as a base, and then overwrite it with a smaller period later.
  #
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  overlap:
    policy: "error_on_overlap"
