# ═══════════════════════════════════════════════════════════════
#                    TrendRadar Configuration File
#                      Version: 2.2.0
# ═══════════════════════════════════════════════════════════════


# Visual configuration editor address: https://sansan0.github.io/TrendRadar/


# ===============================================================
# 1. Basic Settings
# ===============================================================
app:
  # Timezone configuration (affects all time displays, scheduling system judgments, and data storage)
  # Common timezones:
  #   - Asia/Shanghai (Beijing Time UTC+8)
  #   - America/New_York (Eastern Time UTC-5/-4)
  #   - Europe/London (London Time UTC+0/+1)
  # Complete timezone list: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
  timezone: "Asia/Ho_Chi_Minh"
  show_version_update: true           # Whether to show version update prompts (true=show, false=hide)


# ===============================================================
# 1.5 Scheduling System —— What to do and when
#
# Automatically determined by the time periods defined in timeline.yaml:
#   - When to push notifications
#   - When to perform AI analysis
#   - What reporting mode to use
#
# Quick start: Choose a preset template and just change the preset value
#
#   always_on       → 24/7, push immediately when there are new items
#   morning_evening → All-day push + evening daily summary (recommended)
#   office_hours    → Workday three-phase (arrival→noon→off-work), weekend incremental free push
#   night_owl       → Afternoon quick glance + late-night all-day summary
#   custom          → Fully customized, see timeline.yaml for details
#
# For detailed timeline charts, please check config/timeline.yaml
# ===============================================================
schedule:
  enabled: false                        # Whether to enable the scheduling system (true=enable, false=disable, default is disabled)
  preset: "morning_evening"             # Preset template name (see description above)


# ===============================================================
# 2. Data Sources - Trending Platforms
#
# enabled: Whether to enable trending list scraping (master switch)
# sources: Platform list
#   - id: Platform unique identifier (do not modify)
#   - name: Display name (customizable, modifying it does not affect operation)
# ===============================================================
platforms:
  enabled: true                         # Must remain true to scrape RSS (required by TrendRadar main logic)
  sources: []                           # Clear trending data sources, rely only on RSS



# ===============================================================
# 3. Data Sources - RSS Subscriptions
#
# Stored separately from trending data, displayed as a time stream
# Each source configuration: id (unique identifier), name (display name), url (subscription address)
# enabled: Optional, default true
# max_age_days: Optional, overrides global freshness_filter.max_age_days
# ===============================================================
rss:
  enabled: true                       # Whether to enable RSS scraping (true=enable, false=disable)

  # Article freshness filtering (filters overage old articles to avoid duplicate pushes)
  # Filtered only during the push phase, all articles will still be saved to the database
  freshness_filter:
    enabled: true                     # Whether to enable freshness filtering (true=enable, false=disable)

    max_age_days: 1                   # Maximum article age (days)
                                      # - Positive integer: Only push articles within N days
                                      # - 0: Disable filtering, push all articles

  # A single feed can configure max_age_days to override the global setting:
  # - Not configured: Use global freshness_filter.max_age_days (default 3 days)
  # - Positive integer: Override global setting, only push articles within this number of days
  # - 0: Disable freshness filtering for this channel, push all articles
  feeds:
    - id: "vnexpress"
      name: "VnExpress"
      url: "https://vnexpress.net/rss/tin-moi-nhat.rss"

    - id: "tuoitre"
      name: "Tuổi Trẻ"
      url: "https://tuoitre.vn/rss/tin-moi-nhat.rss"
      
    - id: "dantri"
      name: "Dân Trí"
      url: "https://dantri.com.vn/rss/home.rss"


# ===============================================================
# 3.5. Dữ liệu từ Crawler Bot
# ===============================================================
crawler_bot:
  enabled: true
  output_dir: "llm_news_crawler_bot/output"
  mark_as_processed: true


# ===============================================================
# 4. Report Mode
# ===============================================================
report:
  mode: "current"                     # Report mode (used as default after enabling schedule, will be overridden by timeline periods)
                                      # daily = Daily summary, push all matching news of the day on time (will include previously pushed ones)
                                      # current = Current ranking, push currently ranked matching news on time (those continuously ranked will appear every time)
                                      # incremental = Incremental monitoring, only push new content, zero repetition (no push if there is no new content)

  display_mode: "keyword"             # Grouping dimension
                                      # keyword = Group and display by keyword
                                      # platform = Group and display by platform/source

  sort_by_position_first: false       # Keyword mode sorting (only effective when display_mode=keyword)
                                      # true = Sort by the defined order in frequency_words.txt
                                      # false = Sort by the number of matched hot topics (more matches first)

  rank_threshold: 5                   # Ranking highlight threshold (affects display emphasis, does not change scraping scope)

  max_news_per_keyword: 0             # Maximum display quantity per keyword/tag (0=unlimited, only affects display truncation)


# ===============================================================
# 4.5 Filtering Strategy
# ===============================================================
filter:
  method: "keyword"                     # Filtering method (choose one of two)
                                       # keyword = Keyword matching, does not call AI, does not consume tokens, but rules are fixed
                                       #           Phrases are defined in config/frequency_words.txt
                                       # ai = AI intelligent classification, more flexible but consumes tokens per run
                                       #      Interest descriptions are in config/ai_interests.txt, needs to be used with ai_filter below

  priority_sort_enabled: true          # AI mode tag sorting (only effective when method=ai)
                                       # true = Sort by the defined order in interest descriptions
                                       # false = Sort by the number of matches (more matches first)


# ===============================================================
# 4.6 AI Intelligent Filtering Configuration (only effective when filter.method=ai)
# ===============================================================
ai_filter:
  batch_size: 200                         # Number of titles sent to AI per batch, automatically batched if exceeding this number
  batch_interval: 2                       # Batch interval (seconds), to avoid triggering API rate limits, 0=no wait

  min_score: 0.7                          # Minimum score threshold for pushing (0.0~1.0), higher values are stricter
                                          # Recommended to start with 0.5~0.7, 0=no filtering

  # Interest description file (default config/ai_interests.txt, no configuration needed)
  # Put custom files in the config/custom/ai/ directory, then specify the filename:
  # interests_file: "finance.txt"    # → Loads config/custom/ai/finance.txt

  reclassify_threshold: 0.6              # Full reclassification trigger threshold (0~1)
                                          # Lower values tend towards full reclassification (more accurate but consumes more tokens)
                                          # Higher values tend towards incremental updates (saves tokens but might not be as fresh)

  # The following prompt templates generally do not need modification (not recommended to change)

  # Classification prompt template
  prompt_file: "prompt.txt"

  # Tag extraction prompt template (used during first run)
  extract_prompt_file: "extract_prompt.txt"

  # Tag update prompt template (AI compares old and new tags when interests change)
  update_tags_prompt_file: "update_tags_prompt.txt"


# ===============================================================
# 5. Push content control
#
# Unified management of which regions to display in push messages and their order
# ===============================================================
display:
  # Region display order (top to bottom = top to bottom in push)
  # To adjust order: just cut and paste the entire line
  # To display a region, it must simultaneously be: 1. In this list  2. The corresponding switch in regions below is true
  region_order:
    - new_items                           # 1️⃣ New hot items region
    - hotlist                             # 2️⃣ Hotlist region (keyword matching / AI intelligent filtering)
    - rss                                 # 3️⃣ RSS subscription region
    - standalone                          # 4️⃣ Standalone display region
    - ai_analysis                         # 5️⃣ AI analysis region

  # Push region switches (must be used with region_order above)
  regions:
    hotlist: true                     # Hotlist region: keyword matching / AI intelligent filtering (true=show, false=hide)
    new_items: false                  # New hot items region: includes new hotlist items + new RSS items (true=show, false=hide)
                                      # Note: The new item marker 🆕 in hot vocabulary statistics is not affected by this configuration

    rss: true                         # RSS subscription region (true=show and analyze, false=hide and skip analysis)
    standalone: false                 # Standalone display region: complete hotlist/RSS, unaffected by keyword filtering (true=show, false=hide)
    ai_analysis: true                 # AI analysis region (true=show, false=hide)

  # Standalone display region: display specified platforms/RSS completely, unaffected by keyword filtering
  # Push display is controlled by regions.standalone, AI analysis is controlled by ai_analysis.include_standalone
  standalone:
    platforms: []     # Hotlist platform ID list (e.g., ["zhihu", "weibo"])
    rss_feeds: ["vnexpress", "tuoitre", "dantri"]                                # RSS feed ID list (e.g., ["hacker-news"])
    max_items: 20                                # Maximum number of items to display per source (0=unlimited)


# ===============================================================
# 6. Push notifications
#
# ⚠️ Security warning: Do not make webhook URLs public!
#    For GitHub deployment, please put webhooks in GitHub Secrets, do not write them here
#
# 📌 Multiple accounts: separated by semicolons (;), e.g., "url1;url2;url3"
#    The number of paired items (like Telegram token and chat_id) must match
# ===============================================================
notification:
  enabled: true                       # Whether to enable notification function (true=enable, false=disable) —— Master switch
                                      # After enabling schedule, this remains the master switch: false=never push, true=controlled by schedule

  # Push channel configuration
  channels:
    feishu:
      webhook_url: ""                 # Feishu bot webhook URL

    dingtalk:
      webhook_url: ""                 # DingTalk bot webhook URL

    wework:
      webhook_url: ""                 # WeCom bot webhook URL
      msg_type: "markdown"            # Message type: markdown (group bot) | text (personal WeChat app)

    telegram:
      bot_token: ""                   # Telegram Bot Token
      chat_id: ""                     # Telegram Chat ID

    email:
      from: ""                        # Sender email address
      password: ""                    # Sender email password or authorization code
      to: ""                          # Recipient email addresses, multiple separated by commas
      smtp_server: ""                 # SMTP server (optional, leave blank for automatic detection)
      smtp_port: ""                   # SMTP port (optional, leave blank for automatic detection)

    ntfy:
      server_url: "https://ntfy.sh"   # ntfy server address (can be changed to self-hosted)
      topic: ""                       # ntfy topic name
      token: ""                       # ntfy access token (optional, for private topics)

    bark:
      url: ""                         # Bark push URL (format: https://api.day.app/your_device_key)

    slack:
      webhook_url: ""                 # Slack Incoming Webhook URL

    generic_webhook:
      webhook_url: ""                 # Generic Webhook URL (supports Discord, Matrix, IFTTT, etc.)
      payload_template: ""            # JSON template, supports {title} and {content} placeholders
                                      # Example: {"content": "{content}"}
                                      # Leave blank to use default format: {"title": "{title}", "content": "{content}"}


# ===============================================================
# 7. Storage Configuration
# ===============================================================
storage:
  # Storage backend selection
  # - auto: Automatic selection (GitHub Actions with remote storage configured → remote, otherwise → local)
  # - local: Local SQLite + TXT/HTML files
  # - remote: Remote cloud storage (S3 compatible protocol, supports R2/OSS/COS, etc.)
  backend: "auto"

  # Data format options
  formats:
    sqlite: true                      # Primary storage (must remain true, do not disable)
    txt: false                        # Whether to generate TXT snapshots (true=generate, false=do not generate)
    html: true                        # Whether to generate HTML reports (true=generate, false=do not generate)
                                      # ⚠️ Must be set to true for email push or viewing web-based reports

  # Local storage configuration
  local:
    data_dir: "output"                # Data directory
    retention_days: 0                 # Retention days (0=keep permanently)

  # Remote storage configuration (S3 compatible protocol)
  # Supports: Cloudflare R2, Alibaba Cloud OSS, Tencent Cloud COS, AWS S3, MinIO, etc.
  # Recommended to configure sensitive information in GitHub Secrets or environment variables
  remote:
    retention_days: 0                 # Retention days (0=keep permanently)

    # S3 compatible configuration (or use environment variables like S3_ENDPOINT_URL)
    endpoint_url: ""                  # Service endpoint
                                      # Cloudflare R2: https://<account_id>.r2.cloudflarestorage.com
                                      # Alibaba Cloud OSS: https://oss-cn-hangzhou.aliyuncs.com
                                      # Tencent Cloud COS: https://cos.ap-guangzhou.myqcloud.com
    bucket_name: ""                   # Bucket name
    access_key_id: ""                 # Access key ID
    secret_access_key: ""             # Secret access key
    region: ""                        # Region (optional, required by some providers)

  # Data pulling (sync from remote to local, used for scenarios like MCP Server)
  pull:
    enabled: false                    # Whether to enable automatic pulling on startup (true=enable, false=disable)
    days: 7                           # Pull data for the last N days


# ===============================================================
# 8. AI Model Configuration (shared by ai_analysis / ai_translation / ai_filter)
# ===============================================================
ai:
  # LiteLLM model format: provider/model_name
  # Sử dụng mô hình từ 9router (bạn có thể thay đổi sang ag/claude-sonnet-4-6, v.v. từ danh sách của bạn)
  model: "openai/ag/gemini-3.1-pro-low"
  fallback_models: ["openai/ag/claude-sonnet-4-6"]

  api_key: ""      # Điền API Key của 9router vào đây
  
  api_base: "http://localhost:20128/v1" # ĐỔI 'PORT' THÀNH PORT CỦA 9ROUTER (VD: 4000, 8080)
                                    #
                                    # ❓ When do I need to fill this in?
                                    #    When the AI provider you are using is not in the supported list above.
                                    #    For example, some regional API proxies, privately deployed services, etc.
                                    #    If you are using mainstream providers like DeepSeek, OpenAI, Gemini, etc.,
                                    #    you don't need to fill this in, just leave it blank.
                                    #
                                    # 🔧 How to fill it in? Two steps:
                                    #    Step 1 - api_base: fill in the API address provided by your service provider
                                    #      Example: https://your-provider.com/v1
                                    #
                                    #    Step 2 - model: add the "openai/" prefix in front
                                    #      Example: openai/deepseek-ai/DeepSeek-V3
                                    #
                                    # 💡 Why add the openai/ prefix?
                                    #    Most AI providers are compatible with the same universal API format,
                                    #    adding openai/ tells the system to "connect using this universal format",
                                    #    so almost any provider can be integrated.


  timeout: 120                      # Request timeout (seconds)

  temperature: 1.0                  # Sampling temperature (0.0-2.0)
                                    # Note: Some models (like gpt-5) may require this to be exactly 1.0, otherwise an error will occur
  
  max_tokens: 10000                  # Maximum generated tokens
                                    # Note: If the API does not support this parameter (returns HTTP 400), please set to 0 to disable sending it
  # Advanced options
  num_retries: 1                    # Number of retries on failure
  fallback_models: []               # Fallback model list (optional)
                                    # Example: ["openai/gpt-4o-mini", "openai/deepseek-ai/DeepSeek-V3"]

  # Extra parameters (generally no need to modify, remove the # to enable)
  # extra_params:
  #   top_p: 1.0
  #   presence_penalty: 0.0
  #   stop: ["END"]


# ===============================================================
# 9. AI Analysis Feature (model configuration is in the ai section above)
# ===============================================================
ai_analysis:
  enabled: true                     # Whether to enable AI analysis (true=enable, false=disable) —— Master switch

  language: "Tiếng Việt"               # Analysis report language (e.g., "English", "Korean", "French")
  prompt_file: "ai_analysis_prompt.txt"   # Prompt file (relative to the config directory)

  mode: "follow_report"             # AI analysis mode (can be independent of report.mode)
                                    # follow_report = Follow report.mode (default)
                                    # daily / current / incremental = Force use of specified mode

  max_news_for_analysis: 150        # Maximum number of news items for analysis (key item for controlling token cost)
                                    # Hotlists take priority for the quota, RSS uses the remaining quota, standalone display areas are not subject to this limit

  include_rss: true                # Whether to include RSS content for analysis (true=include, false=exclude)
  include_standalone: true          # Whether to include standalone display area data (true=include, false=exclude)

  include_rank_timeline: true       # Rank timeline detail level
                                    # true = Complete trajectory (e.g., 1(09:30)→2(10:00)), AI analysis is more accurate but consumes 0.5~1 times more tokens
                                    # false = Simplified format (rank range + occurrence count), saves more tokens




# ===============================================================
# 10. AI Translation Feature (model configuration is in the ai section above)
#
# Translate push titles, excluding AI analysis content
# ===============================================================
ai_translation:
  enabled: false                     # Whether to enable the translation feature (true=enable, false=disable)
  language: "Tiếng Việt"                   # Target translation language (e.g., "English", "Korean", "French")
  prompt_file: "ai_translation_prompt.txt"   # Prompt file (relative to the config directory)

  # Translation scope (regions disabled in display.regions will not be translated even if enabled here)
  scope:
    hotlist: true                  # Translate hotlist titles (true=translate, false=do not translate)
    rss: true                       # Translate RSS titles (true=translate, false=do not translate)
    standalone: true                # Translate standalone display area titles (true=translate, false=do not translate)


# ===============================================================
# 11. Advanced settings (generally no need to modify)
# ===============================================================
advanced:
  debug: false                        # Debug mode (true=enable detailed logs, false=normal mode)

  # Version check
  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"
  mcp_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_mcp"
  configs_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_configs"

  # Hotlist crawler technical parameters
  crawler:
    request_interval: 2000            # Request interval (milliseconds)
    use_proxy: false                  # Whether to enable proxy (true=enable, false=do not use)
    default_proxy: "http://127.0.0.1:10801"

  # RSS settings
  rss:
    request_interval: 1000            # Request interval (milliseconds)
    timeout: 15                       # Request timeout (seconds)
    use_proxy: false                  # Whether to use proxy (true=enable, false=do not use)
    proxy_url: ""                     # RSS exclusive proxy (leave empty to use crawler.default_proxy)

  # Sorting weights (used to reorder hot searches from different platforms)
  # Sum must equal 1
  weight:
    rank: 0.6                         # Rank weight
    frequency: 0.3                    # Frequency weight
    hotness: 0.1                      # Hotness weight

  # Multiple account limits
  max_accounts_per_channel: 3         # Maximum number of accounts per channel

  # The following are internal parameters (generally no need to modify)
  # Message batch size (bytes) - internal configuration, do not modify
  batch_size:
    default: 4000
    dingtalk: 20000
    feishu: 30000
    bark: 4000
    slack: 4000
  batch_send_interval: 3              # Batch send interval (seconds)
  feishu_message_separator: "━━━━━━━━━━━━━━━━"
